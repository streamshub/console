#
# This example demonstrates how to enable and configure NetworkPolicies for the
# StreamsHub Console using the `spec.networking.networkPolicy` field.
#
# When `networkPolicy.enabled` is true, the operator automatically generates
# NetworkPolicy resources for all Console operands (the console server, Dex identity
# broker if enabled, and the private Prometheus instance if enabled).
#
# On plain Kubernetes (non-OpenShift), the operator cannot determine the ingress
# controller automatically. Provide the ingress controller namespace and pod
# selector under `spec.networking.networkPolicy.ingress.from` so that ingress
# traffic to the console pod is restricted to that controller.
#
# !!IMPORTANT!!
# This example uses a Strimzi KafkaUser custom resource credentials for
# authentication with the Kafka cluster. Access to the user's credentials secret
# must be granted to the Console using a role and role binding, as shown in
# kafkauser-role-rolebinding.yaml.
#
---
apiVersion: console.streamshub.github.com/v1alpha1
kind: Console
metadata:
  name: example
spec:
  hostname: example-console.${CLUSTER_DOMAIN}

  networking:
    networkPolicy:
      enabled: true
      ingress:
        # Define allowed sources of ingress traffic (matching NetworkPolicyIngressRule.from).
        # Adjust selectors or IP blocks to match your ingress controller or gateway.
        from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ingress-nginx
            podSelector:
              matchLabels:
                app.kubernetes.io/name: ingress-nginx

  kafkaClusters:
    # Kafka cluster configuration.
    # The example uses the Kafka cluster configuration from `examples/kafka`.
    # Adjust the values to match your environment.
    - name: console-kafka             # Name of the `Kafka` CR representing the cluster
      namespace: ${KAFKA_NAMESPACE}   # Namespace where the `Kafka` CR is deployed
      listener: secure                # Listener name from the `Kafka` CR to connect the console
      credentials:
        kafkaUser:
          name: console-kafka-user1   # Name of the `KafkaUser` CR used to connect to the Kafka cluster
