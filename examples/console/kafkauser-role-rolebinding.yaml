---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: example-console-kafkauser-secret-reader
  namespace: ${KAFKA_NAMESPACE}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
    # use one actual Secret name per KafkaUser Secret
    - console-kafka-user1
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: example-console-kafkauser-secret-reader
  namespace: ${KAFKA_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: example-console-kafkauser-secret-reader
subjects:
  - kind: ServiceAccount
    name: example-console-serviceaccount
    namespace: ${CONSOLE_NAMESPACE}
