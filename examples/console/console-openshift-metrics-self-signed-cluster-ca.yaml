#
# This example demonstrates using OpenShift user-workload monitoring as
# a source of Kafka metrics for the console. This configuration uses the
# `openshift-monitoring` metrics source type. The connection between a
# `metricsSources` entry and a `kafkaClusters` entry is established through 
# the `metricsSource` specified for the Kafka cluster.
#
# See https://docs.openshift.com/container-platform/4.17/observability/monitoring/enabling-monitoring-for-user-defined-projects.html
# for details on how to enable monitoring of user-defined projects in OpenShift.
#
# !!IMPORTANT!!
# This example uses a Strimzi KafkaUser custom resource credentials for
# authentication with the Kafka cluster. Access to the user's credentials secret
# must be granted to the Console using a role and role binding, as shown in
# kafkauser-role-rolebinding.yaml.
#
---
apiVersion: console.streamshub.github.com/v1alpha1
kind: Console
metadata:
  name: example
spec:
  hostname: example-console.${CLUSTER_DOMAIN}

  metricsSources:
    # Example metrics source using OpenShift's built-in monitoring.
    - name: my-ocp-prometheus
      type: openshift-monitoring
      # When your OpenShift cluster uses a self-signed CA you can pass the cluster root CA
      # into the console by setting the trustStore below. The console injects the cert into
      # its truststore and can then validate the metrics endpoint (the Thanos Querier
      # route). The kube-root-ca.crt ConfigMap is available in every namespace on an
      # OpenShift cluster, so no extra setup is required.
      #
      # On most clusters this works because the route's CA is present in the cluster root
      # CA bundle (for example on managed/hosted OpenShift, or when a single custom CA
      # signs the whole cluster). If you still get a PKIX path building error, the route is
      # signed by a separate ingress CA that is not in the cluster root CA bundle; supply
      # the CA that actually signs the route instead. To see which CA that is:
      #   HOST=$(oc get route thanos-querier -n openshift-monitoring -o jsonpath='{.spec.host}')
      #   echo | openssl s_client -connect "$HOST:443" 2>/dev/null | openssl x509 -noout -issuer
      trustStore:
        content:
          valueFrom:
            configMapKeyRef:
              key: ca.crt
              name: kube-root-ca.crt
        type: PEM

  kafkaClusters:
    # Kafka cluster configuration.
    # The example uses the Kafka cluster configuration from `examples/kafka`.
    # Adjust the values to match your environment.
    - name: console-kafka             # Name of the `Kafka` CR representing the cluster
      namespace: ${KAFKA_NAMESPACE}   # Namespace where the `Kafka` CR is deployed
      listener: secure                # Listener name from the `Kafka` CR to connect the console
      metricsSource: my-ocp-prometheus # Name of the configured metrics source defined in `metricsSources`
      credentials:
        kafkaUser:
          name: console-kafka-user1   # Name of the `KafkaUser` CR used by the console to connect to the Kafka cluster
                                      # This is optional if properties are used to configure the user
