#
# This example demonstrates the use of an LDAP directory at `.spec.security.ldap`
# for user authentication in the console. When LDAP is configured, the operator
# deploys and manages a Dex identity broker that connects to the LDAP server, and
# configures the console to use Dex as its OIDC provider.
#
# The LDAP bind credentials are stored in a separate Secret resource (first) and
# referenced from `.spec.security.ldap.bindSecret`. The user and group search
# settings are written for the sample OpenLDAP deployment in openldap.yaml.
#
# In addition to the LDAP configuration, this example shows how to configure
# subjects and roles for user authorization based on LDAP group membership.
# This resource intentionally defines no Kafka clusters (`.spec.kafkaClusters`)
# in order to focus on the LDAP security configuration.
#
# Replace the hostname and LDAP connection details with values specific to the
# environment. See README.md in this directory for deployment instructions.
#
---
kind: Secret
apiVersion: v1
metadata:
  name: console-openldap-bind-secret
stringData:
  bindSecret: password123
---
apiVersion: console.streamshub.github.com/v1alpha1
kind: Console
metadata:
  name: example
spec:
  hostname: example-console.${CLUSTER_DOMAIN}
  # See examples/console for other sample Kafka cluster configuration. This example resource
  # focuses on LDAP security configuration.
  kafkaClusters: []
  security:
    ldap:
      host: openldap.default.svc.cluster.local:389
      insecureNoSSL: true
      bindDN: cn=readonly,dc=streamshub,dc=dev
      bindSecret:
        valueFrom:
          secretKeyRef:
            name: console-openldap-bind-secret
            key: bindSecret
      userSearch:
        # BaseDN to start the search from. It will translate to the query
        # "(&(objectClass=inetOrgPerson)(uid=<username>))".
        baseDN: ou=people,dc=streamshub,dc=dev
        # Optional filter to apply when searching the directory.
        filter: "(objectClass=inetOrgPerson)"

        # username attribute used for comparing user entries. This will be translated
        # and combined with the other filter as "(<attr>=<username>)".
        username: uid
        # The following three fields are direct mappings of attributes on the user entry.
        # String representation of the user.
        idAttr: uid
        # Required. Attribute to map to Email.
        emailAttr: mail
        # Maps to display name of users. No default value.
        nameAttr: cn
        # Maps to preferred username of users. No default value.
        preferredUsernameAttr: uid

      groupSearch:
        # BaseDN to start the search from. It will translate to the query
        # "(&(objectClass=groupOfNames)(member=<user DN>))".
        baseDN: ou=groups,dc=streamshub,dc=dev
        # Optional filter to apply when searching the directory.
        filter: "(objectClass=groupOfNames)"

        # Following list contains field pairs that are used to match a user to a group. It adds an additional
        # requirement to the filter that an attribute in the group must match the user's
        # attribute value.
        userMatchers:
        - userAttr: DN
          groupAttr: member

        # Represents group name.
        nameAttr: cn

    roles:
      - name: console-role
        rules:
          - privileges:
              - GET
              - LIST
            resourceNames:
              - '*'
            resources:
              - kafkas
    subjects:
      - claim: groups
        include:
          - developers
        roleNames:
          - console-role
