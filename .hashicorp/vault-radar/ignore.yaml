- paths:
    - "operator/controller/src/test/resources/io/streamshub/console/kube-apiserver-lb-signer.pem"
    - "operator/controller/src/test/resources/io/streamshub/console/kube-certs.pem"
    - "operator/controller/src/test/resources/io/streamshub/console/kube-certs.jks"
