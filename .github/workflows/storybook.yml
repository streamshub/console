name: Build and Deploy Storybook to Chromatic

on:
  push:
    branches:
      - main
    paths:
      - 'api/src/main/webui/**'
      - '!api/src/main/webui/package.json'
      - '!api/src/main/webui/package-lock.json'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build Storybook
        working-directory: ./api/src/main/webui
        run: |
          npm ci
          npx playwright install
          npm run build-storybook

      - name: Publish to Chromatic
        id: chromatic
        uses: chromaui/action@v18
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: 'storybook-static'
          workingDir: './api/src/main/webui'

      - name: Test Storybook
        working-directory: ./api/src/main/webui
        run: |
          npm run test-storybook -- --no-index-json --url ${{ steps.chromatic.outputs.storybookUrl }}
